apiVersion: apps/v1
kind: Deployment
metadata:
  name: drive-sync-service
spec:
  # Stateless (session lives in an encrypted cookie), so it scales horizontally.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: drive-sync-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: drive-sync-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ivy/drive-sync-service
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: drive-sync-config }
            # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET. Created out of band by
            # scripts/create-secrets.sh; never committed.
            - secretRef: { name: ivy-secrets }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
